services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro
      - hls_data:/app/hls
    environment:
      - API_KEY=${API_KEY:-change-me}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8080}
    # Blackmagic-kort kräver host network eller device-access på Linux
    # network_mode: host   # avkommentera om sdi2110 behöver direktåtkomst
    devices: []            # lägg till t.ex. /dev/blackmagic0 vid behov

volumes:
  hls_data:
