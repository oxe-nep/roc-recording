<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Volume</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        color: #d8d8d8;
        margin: 0;
        padding: 12px;
      }
      label {
        display: block;
        margin: 10px 0 6px;
        font-size: 12px;
      }
      select {
        width: 100%;
        box-sizing: border-box;
      }
      p {
        font-size: 11px;
        opacity: 0.8;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <label for="target">Target</label>
    <select id="target">
      <option value="pgm">PGM (program audio)</option>
      <option value="intercom">Intercom</option>
    </select>

    <label for="slot">Intercom slot (when target is intercom)</label>
    <select id="slot">
      <option value="0">0 — first intercom</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>

    <label for="direction">Direction</label>
    <select id="direction">
      <option value="up">Increase (+)</option>
      <option value="down">Decrease (−)</option>
    </select>

    <p>Volume changes are applied in the commentator browser tab.</p>
    <script>
      let websocket = null;
      let uuid = null;
      let settings = {};

      function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
        uuid = inPropertyInspectorUUID;
        const actionInfo = JSON.parse(inActionInfo);
        settings = actionInfo.payload?.settings || {};
        document.getElementById("target").value = settings.target || "pgm";
        document.getElementById("slot").value = String(settings.slot ?? 0);
        document.getElementById("direction").value = settings.direction || "up";

        websocket = new WebSocket("ws://127.0.0.1:" + inPort);
        websocket.onopen = () => {
          websocket.send(JSON.stringify({ event: inRegisterEvent, uuid }));
        };
      }

      function save() {
        if (!websocket || !uuid) return;
        settings.target = document.getElementById("target").value;
        settings.slot = Number(document.getElementById("slot").value);
        settings.direction = document.getElementById("direction").value;
        websocket.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
      }

      for (const id of ["target", "slot", "direction"]) {
        document.getElementById(id).addEventListener("change", save);
      }
    </script>
  </body>
</html>
